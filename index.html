<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serah Terima & Tracking Dokumen</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- QRCode JS Generator Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            softBg: '#F8FAFC',
            softCard: '#FFFFFF',
            softPrimary: '#6366F1',
            softPrimaryHover: '#4F46E5',
            softAccent: '#EEF2FF',
            softText: '#334155',
            softMuted: '#94A3B8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen text-softText antialiased">

  <!-- Container App -->
  <div class="w-full max-w-md bg-softBg min-h-screen shadow-xl flex flex-col justify-between relative pb-14">
    
    <!-- Header -->
    <header class="bg-white px-5 py-4 shadow-sm border-b border-slate-100 flex items-center justify-between sticky top-0 z-10">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center text-softPrimary font-bold text-xl">
          <i class="fa-solid fa-file-signature"></i>
        </div>
        <div>
          <h1 class="text-base font-semibold text-slate-800">Serah Terima Dokumen</h1>
          <p class="text-xs text-softMuted">Sistem Tracking Barcode</p>
        </div>
      </div>
      <!-- Live Clock -->
      <div class="text-right">
        <span id="liveClock" class="text-xs font-medium text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100">
          00:00:00
        </span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="p-4 space-y-4 flex-1">

      <!-- STEP 1: Form Buat Tiket / QR Code Baru -->
      <div class="bg-softCard p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
        <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 block border-b pb-2">
          <i class="fa-solid fa-pen-to-square mr-1"></i> 1. Buat Dokumen & QR Code
        </label>
        
        <!-- Jenis / Nama Dokumen Dropdown & Manual -->
        <div>
          <label class="text-xs text-slate-500 mb-1 block font-medium">Nama / Jenis Dokumen</label>
          <select id="docTypeSelect" onchange="handleManualInput('docType')" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-softPrimary mb-1">
            <option value="">-- Pilih Jenis Dokumen --</option>
            <option value="Delivery Ticket">Delivery Ticket</option>
            <option value="Invoice">Invoice</option>
            <option value="PO">PO</option>
            <option value="Memo">Memo</option>
            <option value="MANUAL">-- Ketik Manual --</option>
          </select>
          <input type="text" id="docTypeManual" placeholder="Ketik nama dokumen..." class="hidden w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-softPrimary">
        </div>

        <!-- Pengirim Dropdown & Manual -->
        <div>
          <label class="text-xs text-slate-500 mb-1 block font-medium">Pengirim</label>
          <select id="senderSelect" onchange="handleManualInput('sender')" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-softPrimary mb-1">
            <option value="">-- Pilih Pengirim --</option>
            <option value="Fikri">Fikri</option>
            <option value="Resepsionis">Resepsionis</option>
            <option value="Giyas">Giyas</option>
            <option value="Pa Briawan">Pa Briawan</option>
            <option value="Bu Henita">Bu Henita</option>
            <option value="Bu Eryca">Bu Eryca</option>
            <option value="Pa Subhan">Pa Subhan</option>
            <option value="Pa Budi Maersk">Pa Budi Maersk</option>
            <option value="Pa Bayu Respex">Pa Bayu Respex</option>
            <option value="Pa Lutfi Humala">Pa Lutfi Humala</option>
            <option value="Eri Wira">Eri Wira</option>
            <option value="Dio Wira">Dio Wira</option>
            <option value="Supratin Wira">Supratin Wira</option>
            <option value="MANUAL">-- Ketik Manual --</option>
          </select>
          <input type="text" id="senderManual" placeholder="Ketik nama pengirim..." class="hidden w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-softPrimary">
        </div>

        <!-- Penerima Dropdown & Manual -->
        <div>
          <label class="text-xs text-slate-500 mb-1 block font-medium">Penerima</label>
          <select id="receiverSelect" onchange="handleManualInput('receiver')" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-softPrimary mb-1">
            <option value="">-- Pilih Penerima --</option>
            <option value="Fikri">Fikri</option>
            <option value="Resepsionis">Resepsionis</option>
            <option value="Giyas">Giyas</option>
            <option value="Pa Briawan">Pa Briawan</option>
            <option value="Bu Henita">Bu Henita</option>
            <option value="Bu Eryca">Bu Eryca</option>
            <option value="Pa Subhan">Pa Subhan</option>
            <option value="Pa Budi Maersk">Pa Budi Maersk</option>
            <option value="Pa Bayu Respex">Pa Bayu Respex</option>
            <option value="Pa Lutfi Humala">Pa Lutfi Humala</option>
            <option value="Eri Wira">Eri Wira</option>
            <option value="Dio Wira">Dio Wira</option>
            <option value="Supratin Wira">Supratin Wira</option>
            <option value="MANUAL">-- Ketik Manual --</option>
          </select>
          <input type="text" id="receiverManual" placeholder="Ketik nama penerima..." class="hidden w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-softPrimary">
        </div>

        <!-- Tombol Generate QR Code -->
        <button onclick="generateBarcode()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-xl transition flex items-center justify-center space-x-2 text-sm">
          <i class="fa-solid fa-qrcode"></i>
          <span>Save & Create Barcode / QR</span>
        </button>

        <!-- Area Hasil QR Code -->
        <div id="qrResultArea" class="hidden p-4 bg-indigo-50 border border-indigo-100 rounded-xl text-center space-y-2">
          <p class="text-xs font-semibold text-indigo-900">QR Code Berhasil Dibuat & Tersimpan!</p>
          <div id="qrcode" class="flex justify-center p-2 bg-white rounded-lg inline-block mx-auto border"></div>
          <p class="text-[11px] text-slate-500">Minta pengirim/kurir untuk **scan QR code ini** untuk memverifikasi pengiriman.</p>
          <div class="flex justify-center items-center space-x-2">
            <span id="generatedDocType" class="text-xs font-semibold text-slate-700 bg-white py-1 px-2.5 rounded-full border"></span>
            <span id="generatedDocCode" class="text-xs font-mono font-bold text-indigo-600 bg-white py-1 px-3 rounded-full border"></span>
          </div>
        </div>
      </div>

      <!-- STEP 2: Scanner Kamera & Bukti Foto -->
      <div class="bg-softCard p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">
            <i class="fa-solid fa-camera mr-1"></i> 2. Scan QR & Upload Bukti
          </label>
          <button id="toggleScanBtn" onclick="toggleScanner()" class="text-xs text-softPrimary font-medium flex items-center space-x-1 hover:underline">
            <i class="fa-solid fa-camera"></i>
            <span id="scanBtnText">Buka Kamera Scan</span>
          </button>
        </div>

        <!-- Camera Wrapper -->
        <div id="reader-wrapper" class="hidden overflow-hidden rounded-xl border-2 border-dashed border-indigo-200 bg-slate-50">
          <div id="reader" class="w-full"></div>
        </div>

        <!-- Input Manual Kode Resi -->
        <div class="relative">
          <i class="fa-solid fa-barcode absolute left-3.5 top-3.5 text-slate-400"></i>
          <input type="text" id="docNumber" placeholder="Hasil Scan Kode Resi / Dokumen" 
                 class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-softPrimary transition">
        </div>

        <!-- Input Foto Bukti Serah Terima -->
        <div>
          <label class="text-xs text-slate-500 mb-1 block">Foto Bukti Fisik / Serah Terima</label>
          <label class="flex items-center justify-center space-x-2 bg-slate-50 border border-dashed border-slate-300 hover:border-softPrimary rounded-xl p-3 cursor-pointer transition text-slate-500 hover:text-softPrimary">
            <i class="fa-solid fa-camera text-lg"></i>
            <span class="text-xs font-medium">Ambil Foto Fisik</span>
            <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" onchange="previewImage(event)">
          </label>
          
          <div id="imagePreviewContainer" class="hidden mt-3 relative rounded-xl overflow-hidden border border-slate-200 bg-black">
            <img id="imagePreview" src="" class="w-full h-40 object-cover opacity-90">
            <div id="imageOverlayStamp" class="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded backdrop-blur-sm"></div>
            <button onclick="removeImage()" class="absolute top-2 right-2 bg-red-500/80 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <button id="btnSubmit" onclick="submitData()" class="w-full bg-softPrimary hover:bg-softPrimaryHover text-white font-medium py-3 rounded-xl shadow-md shadow-indigo-100 transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Konfirmasi & Simpan Pengiriman</span>
        </button>
      </div>

      <!-- STEP 3: Dashboard Riwayat Dokumen -->
      <div class="bg-softCard p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex justify-between items-center border-b pb-2">
          <span><i class="fa-solid fa-list-check mr-1"></i> Dashboard Dokumen (Firebase)</span>
          <span id="totalCount" class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-[10px]">0 Data</span>
        </h2>

        <div id="historyList" class="space-y-3 max-h-80 overflow-y-auto">
          <div id="emptyState" class="text-center py-6 text-slate-400 text-xs">
            <i class="fa-solid fa-box-open text-2xl mb-2 block"></i>
            Memuat data dari Firebase...
          </div>
        </div>
      </div>

    </main>

    <!-- FOOTER ROYALTY -->
    <footer class="w-full max-w-md bg-white border-t border-slate-200 py-3 px-4 text-center text-slate-400 text-[11px] absolute bottom-0 left-0 right-0 rounded-b-xl flex items-center justify-between">
      <div class="flex items-center space-x-1">
        <i class="fa-solid fa-code text-indigo-500"></i>
        <span>Serah Terima App v2.0</span>
      </div>
      <div>
        Created with <i class="fa-solid fa-heart text-red-500 text-[10px]"></i> by <strong class="text-slate-700 font-semibold">Giyas</strong>
      </div>
    </footer>

  </div>

  <!-- FIREBASE SDK (MODULE) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      updateDoc, 
      collection, 
      onSnapshot, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. CONFIG FIREBASE (Ganti pake config lu sendiri bro!)
    const firebaseConfig = {
  apiKey: "AIzaSyAaV-uGhJmM1YIfJajNhhWzLd6eVGdGI4Q",
  authDomain: "document-serah-terima.firebaseapp.com",
  projectId: "document-serah-terima",
  storageBucket: "document-serah-terima.firebasestorage.app",
  messagingSenderId: "182261375560",
  appId: "1:182261375560:web:469e17dd4f16f0857d2e7d"
    };

    // Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let html5QrcodeScanner = null;
    let isScanning = false;
    let capturedImageBase64 = null;

    // Jam Live
    function updateClock() {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Export fungsi ke Window biar bisa dipanggil dari HTML onclick
    window.handleManualInput = function(type) {
      const select = document.getElementById(type + 'Select');
      const manualInput = document.getElementById(type + 'Manual');
      if (select.value === 'MANUAL') {
        manualInput.classList.remove('hidden');
      } else {
        manualInput.classList.add('hidden');
        manualInput.value = '';
      }
    };

    function getValue(type) {
      const select = document.getElementById(type + 'Select');
      if (select.value === 'MANUAL') {
        return document.getElementById(type + 'Manual').value.trim();
      }
      return select.value;
    }

    // 1. Generate QR Code & Simpan draf ke Firestore
    window.generateBarcode = async function() {
      const docType = getValue('docType');
      const sender = getValue('sender');
      const receiver = getValue('receiver');

      if (!docType || !sender || !receiver) {
        alert("Pilih atau isi Jenis Dokumen, Pengirim, dan Penerima terlebih dahulu!");
        return;
      }

      const docCode = 'DOC-' + Math.floor(100000 + Math.random() * 900000);

      try {
        // Simpan ke Firestore collection 'documents'
        await setDoc(doc(db, "documents", docCode), {
          docNo: docCode,
          docType: docType,
          sender: sender,
          receiver: receiver,
          status: 'CREATED',
          createdAt: new Date(),
          photo: null
        });

        // Render QR Code
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, {
          text: docCode,
          width: 128,
          height: 128
        });

        document.getElementById('generatedDocType').innerText = docType;
        document.getElementById('generatedDocCode').innerText = docCode;
        document.getElementById('qrResultArea').classList.remove('hidden');

      } catch (e) {
        alert("Gagal menyimpan ke Firebase: " + e.message);
      }
    };

    // 2. Control Scanner Kamera
    window.toggleScanner = function() {
      const wrapper = document.getElementById('reader-wrapper');
      const btnText = document.getElementById('scanBtnText');

      if (!isScanning) {
        wrapper.classList.remove('hidden');
        btnText.innerText = 'Tutup Kamera';
        
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 200, height: 200 } },
          (decodedText) => {
            document.getElementById('docNumber').value = decodedText;
            window.stopScanner();
          },
          () => {}
        ).catch(err => {
          alert("Gagal membuka kamera: " + err);
          window.stopScanner();
        });

        isScanning = true;
      } else {
        window.stopScanner();
      }
    };

    window.stopScanner = function() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          document.getElementById('reader-wrapper').classList.add('hidden');
          document.getElementById('scanBtnText').innerText = 'Buka Kamera Scan';
          isScanning = false;
        }).catch(err => console.log(err));
      }
    };

    // 3. Handling Preview Foto
window.previewImage = function(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.src = e.target.result;
      img.onload = function() {
        // Resize gambar biar ukurannya kecil (< 200KB) & gak kena limit Firebase
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 600;
        const scaleFactor = MAX_WIDTH / img.width;
        
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scaleFactor;
        
        const ctx = canvas.getContext('canvas');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        // Kompres ke JPEG kualitas 0.7
        capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
        
        document.getElementById('imagePreview').src = capturedImageBase64;
        document.getElementById('imagePreviewContainer').classList.remove('hidden');
        
        const now = new Date();
        document.getElementById('imageOverlayStamp').innerText = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID');
      }
    }
    reader.readAsDataURL(file);
  }
};

    window.removeImage = function() {
      capturedImageBase64 = null;
      document.getElementById('photoInput').value = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
    };

    // 4. Update Status Pengiriman & Upload Foto ke Firestore
    window.submitData = async function() {
      const docNo = document.getElementById('docNumber').value.trim();

      if (!docNo) {
        alert("Silakan Scan QR Code / Masukkan Kode Dokumen lebih dulu!");
        return;
      }

      const docRef = doc(db, "documents", docNo);

      try {
        const docSnap = await getDoc(docRef);

        if (!docSnap.exists()) {
          alert("Nomor Dokumen tidak ditemukan di Firebase!");
          return;
        }

        // Update dokumen yang udah ada
        await updateDoc(docRef, {
          status: 'DELIVERED',
          deliveredAt: new Date(),
          photo: capturedImageBase64 || null
        });

        // Reset Form UI
        document.getElementById('docNumber').value = '';
        window.removeImage();
        document.getElementById('qrResultArea').classList.add('hidden');
        document.getElementById('docTypeSelect').value = '';
        document.getElementById('senderSelect').value = '';
        document.getElementById('receiverSelect').value = '';

        alert(`Dokumen ${docNo} BERHASIL dikonfirmasi & disimpan ke Firebase!`);

      } catch (e) {
        alert("Gagal update data: " + e.message);
      }
    };

    // 5. Listen Real-Time Update dari Firestore ke Dashboard
    const q = query(collection(db, "documents"), orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      const historyContainer = document.getElementById('historyList');
      const emptyState = document.getElementById('emptyState');
      
      const docs = [];
      snapshot.forEach((doc) => {
        docs.push(doc.data());
      });

      document.getElementById('totalCount').innerText = `${docs.length} Data`;

      if (docs.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.innerHTML = `<i class="fa-solid fa-box-open text-2xl mb-2 block"></i> Belum ada dokumen diserahterimakan.`;
        historyContainer.innerHTML = '';
        return;
      }

      emptyState.classList.add('hidden');

      historyContainer.innerHTML = docs.map(data => {
        const dateObj = data.deliveredAt ? data.deliveredAt.toDate() : (data.createdAt ? data.createdAt.toDate() : new Date());
        const dateStr = dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        const timeStr = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        
        const isDelivered = data.status === 'DELIVERED';

        return `
          <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl space-y-2 text-xs">
            <div class="flex justify-between items-center">
              <span class="font-semibold text-slate-700 bg-white px-2 py-0.5 rounded border border-slate-200">
                <i class="fa-solid fa-file-lines text-indigo-500 mr-1"></i> ${data.docType || 'Dokumen'}
              </span>
              <span class="font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100 font-mono">
                ${data.docNo}
              </span>
            </div>

            <div class="grid grid-cols-2 gap-2 text-slate-700 bg-white p-2 rounded-lg border border-slate-100">
              <div><span class="text-slate-400 text-[10px] block">Dikirim Oleh:</span> <strong>${data.sender}</strong></div>
              <div><span class="text-slate-400 text-[10px] block">Diterima Oleh:</span> <strong>${data.receiver}</strong></div>
            </div>

            <div class="flex justify-between items-center pt-0.5 text-[10px]">
              <span class="${isDelivered ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-amber-50 text-amber-600 border-amber-200'} font-semibold px-2 py-0.5 rounded border">
                <i class="fa-solid ${isDelivered ? 'fa-check' : 'fa-clock'} mr-1"></i> ${isDelivered ? 'Selesai' : 'Menunggu Scan'}
              </span>
              <span class="text-slate-400">
                <i class="fa-regular fa-clock mr-1"></i> ${dateStr} • ${timeStr}
              </span>
            </div>

            ${data.photo ? `
              <div class="mt-2">
                <img src="${data.photo}" class="w-full h-28 object-cover rounded-lg border border-slate-200">
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
